name: Generate TikTok Quran Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Dubai"
    - cron: "0 16 * * *"
      timezone: "Asia/Dubai"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install FFmpeg and Arabic rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libraqm-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pexels API key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY is missing"
            exit 1
          fi
          echo "Pexels API key detected"

      - name: Check Arabic font
        run: |
          test -f "fonts/NotoNaskhArabic-Regular.otf"
          echo "Arabic font detected"

      - name: Create output folder
        run: mkdir -p output

      - name: Generate 2 TikTok videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python generate_tiktok.py

      - name: Check generated files
        run: |
          ls -lh output
          test -f output/tiktok_quran_1.mp4
          test -f output/tiktok_quran_2.mp4
          test -f output/metadata_1.txt
          test -f output/metadata_2.txt

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-quran-videos-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: error
