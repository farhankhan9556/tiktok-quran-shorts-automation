name: Generate TikTok Quran Videos

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "OpenAI API key detected"

      - name: Check Arabic font
        run: |
          if [ ! -f "fonts/NotoNaskhArabic-Regular.otf" ]; then
            echo "Arabic font is missing"
            exit 1
          fi
          echo "Arabic font detected"

      - name: Create output folder
        run: |
          mkdir -p output

      - name: Generate 2 TikTok videos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python generate_tiktok.py

      - name: Check generated files
        run: |
          ls -lh output
          test -f output/tiktok_quran_1.mp4
          test -f output/tiktok_quran_2.mp4

      - name: Upload generated videos
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-quran-videos-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: error
