name: Generate TikTok Quran Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * *"
      timezone: "Asia/Dubai"

    - cron: "0 20 * * *"
      timezone: "Asia/Dubai"


jobs:

  generate:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.13"


      - name: Install FFmpeg and Arabic rendering libraries

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg

          sudo apt-get install -y \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libraqm-dev


      - name: Install Python packages

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Check Pexels API key

        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          if [ -z "$PEXELS_API_KEY" ]; then

            echo "PEXELS_API_KEY is missing"

            exit 1

          fi

          echo "Pexels API key detected"


      - name: Check Arabic font

        run: |

          if [ ! -f "fonts/NotoNaskhArabic-Regular.otf" ]; then

            echo "Arabic font is missing"

            exit 1

          fi

          echo "Arabic font detected"


      - name: Create output folder

        run: |

          mkdir -p output


      - name: Generate today's TikTok video

        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python generate_tiktok.py


      - name: Check generated files

        run: |

          ls -lh output

          test -f output/tiktok_quran_1.mp4

          test -f output/metadata_1.txt


      - name: Upload generated video

        uses: actions/upload-artifact@v4

        with:

          name: tiktok-quran-video-${{ github.run_number }}

          path: output/

          retention-days: 7

          if-no-files-found: error
